[program:gallery-queue]
command=php __APP_DIR__/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=__APP_DIR__
user=www-data
autostart=true
autorestart=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/queue.log

[program:gallery-reverb]
command=php __APP_DIR__/artisan reverb:start --host=127.0.0.1 --port=8080
directory=__APP_DIR__
user=www-data
autostart=true
autorestart=true
minfds=10000
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/reverb.log
